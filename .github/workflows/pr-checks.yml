# PR gates: conventional PR title, no AI attribution, and the same quality
# scripts the pre-push hook runs. Hooks can be skipped with --no-verify;
# these cannot. Mark the jobs as required checks in branch protection.
name: PR checks

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title-and-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: sh scripts/lint-pr-title.sh
      # docs/agent-rules/no-ai-attribution.md
      - name: No AI attribution in PR title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | node scripts/check-ai-attribution.mjs --stdin --label "PR title/body"
      - name: No AI attribution in PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-ai-attribution.mjs --git-range "$BASE_SHA..$HEAD_SHA"

  quality:
    # Title/body edits don't change code; skip the expensive job for them.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Format check
        run: npm run format:check
      # Same list as PRE_PUSH_SCRIPTS in scripts/pre-push-check.sh.
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm run depcruise --if-present
      - run: npm run test --if-present
      - run: npm run build --if-present
      - name: Dependency audit
        run: npm run audit:ci

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Free for personal accounts. A GitHub organization needs a
      # GITLEAKS_LICENSE secret (free key from gitleaks.io).
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  python-audit:
    # Reports known vulnerabilities in the app's and the Hugging Face Space's
    # requirements as a warning and
    # in the job summary. Not blocking yet: the pinned FastAPI/Starlette and
    # Whisper's torch have open advisories whose fixes need Python 3.10+.
    # TODO(2026-12-31): fix them, then make this job fail on findings.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pip-audit
      # openai-whisper's sdist can't be resolved in pip-audit's isolated build,
      # so it (and its torch chain) is left out of this audit.
      - name: Audit Python dependencies
        run: |
          for req in backend/requirements.txt deploy/huggingface/requirements.txt; do
            grep -v '^openai-whisper' "$req" > /tmp/requirements-audit.txt
            echo "### $req" >> "$GITHUB_STEP_SUMMARY"
            if pip-audit -r /tmp/requirements-audit.txt -f markdown -o /tmp/audit.md; then
              echo "No known vulnerabilities (openai-whisper/torch not audited)." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning title=Python dependency audit::Known vulnerabilities in $req. See the job summary."
              cat /tmp/audit.md >> "$GITHUB_STEP_SUMMARY"
            fi
          done
