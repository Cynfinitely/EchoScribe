version: "3.8"

services:
  echoscribe:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: echoscribe
    ports:
      - "8000:8000"
    environment:
      - WHISPER_MODEL=base
      - PORT=8000
    volumes:
      # Mount backend for development (comment out for production)
      - ./backend:/app/backend
      # Mount frontend for development (comment out for production)
      - ./frontend:/app/frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Nginx for serving frontend in production
