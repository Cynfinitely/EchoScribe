services:
  echoscribe:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: echoscribe
    ports:
      - "8000:8000"
    environment:
      - WHISPER_MODEL=base
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
