# Python lint config. Gate: scripts/lint-py.sh (npm run lint, pre-commit, CI).
target-version = "py310"
extend-exclude = ["venv"]

[lint.flake8-bugbear]
# FastAPI declares request params as File()/Form()/Depends() defaults by design.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]
